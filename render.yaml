services:
  - type: web
    name: sumisongs-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: spotify_clone
      - key: STORAGE_PROVIDER
        value: gridfs
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: "https://sumisongs.pages.dev,http://localhost:5173"
      - key: ENVIRONMENT
        value: production
      - key: MAX_AUDIO_SIZE_MB
        value: "50"
      - key: MAX_COVER_SIZE_MB
        value: "5"
